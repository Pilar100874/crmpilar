name: Build Coletor Pilar Installer

on:
  push:
    paths:
      - 'coletor/**'
      - '.github/workflows/build-coletor-msi.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: coletor
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify icon
        run: |
          ls -la build/ || true
          if [ ! -f build/icon.ico ]; then
            echo "ERROR: build/icon.ico missing"; exit 1
          fi
          echo "icon size: $(stat -c%s build/icon.ico 2>/dev/null || wc -c < build/icon.ico) bytes"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build NSIS Installer (pt-BR)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColetorPilar-Setup-exe
          path: coletor/dist-installer/ColetorPilar-Setup.exe

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: coletor-v${{ steps.pkg.outputs.version }}
          name: Coletor Pilar v${{ steps.pkg.outputs.version }}
          files: coletor/dist-installer/ColetorPilar-Setup.exe
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coletor
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build AppImage (x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --linux AppImage --x64 --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColetorPilar-Linux-AppImage
          path: coletor/dist-installer/ColetorPilar-Linux.AppImage

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: coletor-v${{ steps.pkg.outputs.version }}
          name: Coletor Pilar v${{ steps.pkg.outputs.version }}
          files: coletor/dist-installer/ColetorPilar-Linux.AppImage
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: coletor
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Mac (Intel e Apple Silicon)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --mac zip --x64 --publish never -c.mac.artifactName='ColetorPilar-Mac-Intel.${ext}'
          npx electron-builder --mac zip --arm64 --publish never -c.mac.artifactName='ColetorPilar-Mac-AppleSilicon.${ext}'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColetorPilar-Mac
          path: coletor/dist-installer/ColetorPilar-Mac-*.zip

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: coletor-v${{ steps.pkg.outputs.version }}
          name: Coletor Pilar v${{ steps.pkg.outputs.version }}
          files: coletor/dist-installer/ColetorPilar-Mac-*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  publish-manifest:
    needs: [build, build-linux, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish matching platform URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./coletor/package.json').version")
          for FILE in ColetorPilar-Setup.exe ColetorPilar-Linux.AppImage ColetorPilar-Mac-Intel.zip ColetorPilar-Mac-AppleSilicon.zip; do
            gh release view "coletor-v$VERSION" --json assets --jq '.assets[].name' | grep -Fx "$FILE" || exit 1
          done
          node <<'NODE'
          const fs = require('fs');
          const version = require('./coletor/package.json').version;
          const file = 'public/coletor/version.json';
          const json = JSON.parse(fs.readFileSync(file, 'utf8').replace(/^\uFEFF/, ''));
          const base = `https://github.com/${process.env.GH_REPO}/releases/download/coletor-v${version}`;
          Object.assign(json, {
            version,
            downloadUrl: `${base}/ColetorPilar-Setup.exe`,
            downloadUrlLinux: `${base}/ColetorPilar-Linux.AppImage`,
            downloadUrlMacIntel: `${base}/ColetorPilar-Mac-Intel.zip`,
            downloadUrlMacAppleSilicon: `${base}/ColetorPilar-Mac-AppleSilicon.zip`,
          });
          fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
          NODE
      - name: Commit version.json bump
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet public/coletor/version.json; then
            echo "version.json unchanged"
          else
            git add public/coletor/version.json
            git commit -m "chore(coletor): publish installer v$(node -p "require('./coletor/package.json').version") [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              echo "push retry $i..."
              sleep 3
            done
          fi

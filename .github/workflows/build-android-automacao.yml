name: Build Pilar Automação APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android-automacao-app/**'
      - '.github/workflows/build-android-automacao.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android-automacao-app

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Definir versão do aplicativo
        id: version
        run: |
          VCODE=$((1 + ${{ github.run_number }}))
          VNAME=$(tr -d ' \n\r' < VERSION)
          echo "AUTO_VERSION_CODE=${VCODE}" >> "$GITHUB_ENV"
          echo "AUTO_VERSION_NAME=${VNAME}" >> "$GITHUB_ENV"
          echo "name=${VNAME}" >> "$GITHUB_OUTPUT"

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Android SDK build-tools
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Configurar PATH do apksigner
        run: echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-automacao-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Tornar gradlew executável
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Normalizar nome do APK
        run: |
          mkdir -p app/build/outputs/apk/release
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$SRC" /tmp/pilar-automacao.apk
          cp /tmp/pilar-automacao.apk app/build/outputs/apk/release/pilar-automacao.apk
          ls -la app/build/outputs/apk/release/

      - name: Assinar APK com debug keystore (fallback)
        if: hashFiles('android-automacao-app/app/build/outputs/apk/release/app-release-unsigned.apk') != ''
        run: |
          apksigner sign \
            --ks ~/.android/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/pilar-automacao.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilar-automacao-apk
          path: android-automacao-app/app/build/outputs/apk/release/pilar-automacao.apk
          if-no-files-found: error

      - name: Publicar Release rolling (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pilar-automacao-latest
          name: Pilar Automação (latest)
          files: android-automacao-app/app/build/outputs/apk/release/pilar-automacao.apk
          make_latest: "false"
          body: |
            Aplicativo Pilar Automação para celular e tablet.
            Instale o arquivo `pilar-automacao.apk` e informe o ambiente que deve abrir.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar / atualizar Release versionada
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pilar-automacao-v${{ steps.version.outputs.name }}
          name: Pilar Automação v${{ steps.version.outputs.name }}
          files: android-automacao-app/app/build/outputs/apk/release/pilar-automacao.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Atualizar manifesto de download (public/apps)
        run: |
          mkdir -p ../public/apps
          APK=app/build/outputs/apk/release/pilar-automacao.apk
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK")
          cat > ../public/apps/pilar-automacao-latest.json <<EOF
          {
            "repo": "${{ github.repository }}",
            "tag": "pilar-automacao-latest",
            "asset": "pilar-automacao.apk",
            "url": "https://github.com/${{ github.repository }}/releases/download/pilar-automacao-latest/pilar-automacao.apk",
            "sha256": "${SHA}",
            "size": ${SIZE},
            "versionCode": ${AUTO_VERSION_CODE:-0},
            "versionName": "${AUTO_VERSION_NAME}",
            "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}"
          }
          EOF

      - name: Commit manifesto atualizado
        working-directory: ${{ github.workspace }}
        run: |
          if git diff --quiet public/apps/pilar-automacao-latest.json; then
            echo "Sem mudanças no manifesto."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/apps/pilar-automacao-latest.json
          git commit -m "chore(automacao-app): atualizar manifesto do APK [skip ci]"
          for i in $(seq 1 5); do
            git pull --rebase origin main && git push && exit 0
            echo "Tentativa $i falhou, tentando novamente..."
            sleep 3
          done
          exit 1

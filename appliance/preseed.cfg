# Preseed — instalação desatendida do Coletor Pilar Appliance (Debian 12)
# ATENÇÃO: apaga todo o disco de destino.

d-i debian-installer/language string pt
d-i debian-installer/country string BR
d-i debian-installer/locale string pt_BR.UTF-8
d-i keyboard-configuration/xkb-keymap select br

# Instalação silenciosa: sem perguntas, sem telas intermediárias
d-i debconf/priority string critical
d-i auto-install/enable boolean true
d-i debian-installer/quiet boolean true
d-i debian-installer/splash boolean true

# ── Rede (com suporte a Wi-Fi) ───────────────────────────────────────────
# Tenta cabo primeiro; se só houver Wi-Fi, o instalador pergunta SSID/senha
# apenas se não estiverem definidos abaixo. Carrega firmware non-free do CD.
d-i hw-detect/load_firmware boolean true
d-i netcfg/choose_interface select auto
d-i netcfg/link_wait_timeout string 15
d-i netcfg/dhcp_timeout string 60
# Se quiser Wi-Fi 100% desatendido, descomente e preencha:
# d-i netcfg/wireless_essid string MINHA_REDE
# d-i netcfg/wireless_essid_again string MINHA_REDE
# d-i netcfg/wireless_security_type select wpa
# d-i netcfg/wireless_wpa string MINHA_SENHA
# Não trava a instalação se a rede falhar (ISO já traz o payload)
d-i netcfg/enable boolean true
d-i netcfg/get_hostname string coletor-pilar
d-i netcfg/get_domain string local
d-i netcfg/hostname string coletor-pilar

d-i mirror/country string BR
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
# Habilita non-free-firmware (drivers Wi-Fi Intel/Realtek/Broadcom)
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true

d-i clock-setup/utc boolean true
d-i time/zone string America/Sao_Paulo
d-i clock-setup/ntp boolean true

# ── Contas ───────────────────────────────────────────────────────────────
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Pilar
d-i passwd/username string pilar
# senha: pilar2468  (troque o hash em produção: mkpasswd -m sha-512)
d-i passwd/user-password-crypted password $6$Xk9pQm2vRt8sLd0f$0m2H2mCa2vD2r5Yk1sQq8oM5rTx0Kx7GJf3nHqM0i5b8Y8v6C3sJ7oQe4pR1wF2aZ9uT0lS6dN8xE1yB4hV3g/
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# ── Particionamento (disco inteiro, LVM simples) ────────────────────────
d-i partman-auto/method string lvm
d-i partman-auto/disk string /dev/sda /dev/nvme0n1 /dev/vda
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# ── Pacotes ──────────────────────────────────────────────────────────────
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string xserver-xorg xinit openbox unclutter x11-xserver-utils \
    network-manager network-manager-gnome wireless-tools wpasupplicant iw rfkill \
    firmware-iwlwifi firmware-realtek firmware-atheros firmware-brcm80211 firmware-misc-nonfree \
    cockpit curl ca-certificates sudo policykit-1 fonts-dejavu \
    libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2 alsa-utils \
    libxss1 libsecret-1-0 chrony plymouth plymouth-themes
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# ── Bootloader ───────────────────────────────────────────────────────────
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

d-i finish-install/reboot_in_progress note

# ── Pós-instalação ───────────────────────────────────────────────────────
d-i preseed/late_command string \
    cp -r /cdrom/coletor /target/opt/coletor-src ; \
    cp /cdrom/scripts/late-command.sh /target/tmp/late-command.sh ; \
    in-target chmod +x /tmp/late-command.sh ; \
    in-target /tmp/late-command.sh
